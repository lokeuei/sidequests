name: sidequests
description: 'Sidequests: less scrolling, more living. Little AI-nudged adventures around you.'
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <5.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  geolocator: ^12.0.0
  flutter_local_notifications: ^17.0.0
  shared_preferences: ^2.3.0
  http: ^1.2.0
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  workmanager: ^0.10.0
  flutter_tts: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
